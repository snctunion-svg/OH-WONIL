<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--pink:#db2777;--pink-d:#9d174d;--pink-s:#fdf2f8;--pink-l:#fbcfe8;--bg:#f1f5f9;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--card:#fff;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--bg:#0c1119;--line:#2c3646;--text:#e5e9f0;--muted:#8b96a8;--card:#161d2b;--pink-s:#2a1320;} }
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%;}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:#fde2ec;border-bottom:3px solid #ec4899;}
header h1{margin:0;font-size:19px;display:flex;align-items:center;gap:8px;color:#111;letter-spacing:.3px;}
header h1 .appLogo{width:40px;height:28px;}
header .sub{font-size:12px;color:#9d174d;font-weight:700;}
header .live{margin-left:auto;font-size:11.5px;color:#64748b;display:flex;align-items:center;gap:5px;}
header .live i{width:8px;height:8px;border-radius:50%;background:#94a3b8;display:inline-block;}
header .live.on i{background:#16a34a;}
main{max-width:1200px;margin:0 auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px));}
.top{display:flex;align-items:center;gap:6px;margin:0 0 10px;flex-wrap:wrap;}
.nav button,.today{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;height:36px;min-width:36px;font-size:18px;cursor:pointer;}
.today{font-size:13px;font-weight:700;color:var(--pink);border-color:var(--pink-l);padding:0 12px;}
.ym{font-size:20px;font-weight:800;min-width:120px;text-align:center;}
.nav{display:flex;align-items:center;gap:4px;}
.legend{margin-left:auto;display:flex;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.dow{background:var(--card);text-align:center;font-size:12.5px;font-weight:800;padding:8px 0;color:var(--muted);}
.dow.sun{color:#dc2626;} .dow.sat{color:#2563eb;}
.cell{background:var(--card);min-height:max(108px, calc((100dvh - 230px) / var(--rows,5)));padding:5px 5px 6px;display:flex;flex-direction:column;gap:2px;min-width:0;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;}
.cell:hover{background:var(--pink-s);}
.cell.out{background:var(--bg);cursor:default;}
.num{font-size:13.5px;font-weight:800;width:24px;height:24px;line-height:24px;text-align:center;border-radius:12px;}
.row{display:flex;align-items:center;gap:4px;min-width:0;}
.hol{font-size:10.5px;color:#dc2626;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell.sat .num{color:#2563eb;} .cell.sun .num,.cell.hl .num{color:#dc2626;}
.cell.today .num{background:var(--pink);color:#fff;}
.ev{font-size:12px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:#111827;padding:1px 4px;border-radius:4px;}
.ev b{font-weight:800;}
.ev.chief{background:#fbcfe8;} .ev.office{background:#fef08a;} .ev.etc{background:#fff;border:1px solid #d1d5db;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .ev:not(.chief):not(.office):not(.etc){color:var(--text);} }
.ev.to{background:#e0f2fe;color:#075985;} .ev.to b{color:#0369a1;}
.item.to{background:#f0f9ff;} .item.to .bar{background:#0ea5e9;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .item.to{color:#111;} }
.toSum{font-size:12.5px;font-weight:800;color:#0369a1;background:#e0f2fe;border-radius:8px;padding:6px 10px;}
.toBtn{border:1px solid #7dd3fc;background:var(--card);color:#0369a1;border-radius:8px;height:36px;font-size:13px;font-weight:800;padding:0 12px;cursor:pointer;}
.toForm{padding:14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;}
.toForm input[type=password]{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:15px;background:var(--card);color:var(--text);}

.toForm button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:700;padding:0 14px;cursor:pointer;font-size:14px;}
.toForm button.pri{background:#0284c7;border-color:#0284c7;color:#fff;}
.toForm .msg{font-size:12.5px;color:#b91c1c;min-height:16px;} .toForm .ok{color:#15803d;}
.toForm .hint{font-size:12px;color:var(--muted);}
.tabs{display:flex;gap:6px;margin:0 0 10px;}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;height:36px;padding:0 16px;font-size:14px;font-weight:800;cursor:pointer;}
.tabs button.on{background:var(--pink);border-color:var(--pink);color:#fff;}
.sh{display:flex;flex-direction:column;gap:12px;}
.shTop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}

.shTop .fy small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;}
.shTop .sp{flex:1;}
.shBtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;height:36px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer;}
.shBtn.pri{background:#0284c7;border-color:#0284c7;color:#fff;}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.card .k{font-size:12px;color:var(--muted);font-weight:700;}
.card .v{font-size:22px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;}
.card .v small{font-size:12px;font-weight:700;color:var(--muted);margin-left:2px;}
.card.lim input{width:100%;font-size:20px;font-weight:800;border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-top:2px;background:var(--card);color:var(--text);}
.card.neg .v{color:#dc2626;} .card.pos .v{color:#15803d;}
.bar2{height:10px;border-radius:5px;background:var(--line);overflow:hidden;} .bar2 i{display:block;height:100%;background:#0ea5e9;}
.bar2.over i{background:#dc2626;}
.tblWrap{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
table.tt{width:100%;border-collapse:collapse;font-size:13.5px;}
.tt th{background:#f0f9ff;color:#075985;font-weight:800;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12.5px;}
.tt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
.tt td.h,.tt th.h{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tt td.d{white-space:nowrap;font-variant-numeric:tabular-nums;}
.tt td.d .w{color:var(--muted);margin-left:4px;font-size:12px;} .tt td.d .w.su{color:#dc2626;} .tt td.d .w.sa{color:#2563eb;}
.tt tr.r{cursor:pointer;} .tt tr.r:hover td{background:var(--pink-s);}
.tt tr.r.future td{color:var(--muted);}
.tt tr.mo td{background:var(--bg);font-weight:800;font-size:12.5px;color:#0369a1;}
.tt td.nt{white-space:pre-wrap;word-break:break-all;}
.tt tfoot td{font-weight:800;background:#e0f2fe;color:#075985;}
.shNote{font-size:12px;color:var(--muted);margin:0;}
.lock{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted);font-size:14px;}
.toForm label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted);}
.toForm label input{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:15px;background:var(--card);color:var(--text);font-weight:600;}
.toForm .btns .del{color:#dc2626;margin-right:auto;}
.more{font-size:11px;color:var(--muted);font-weight:700;padding-left:3px;}
.note{margin:10px 0 0;font-size:12px;color:var(--muted);}
.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:13px;}
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
.pop{background:var(--card);color:var(--text);border-radius:14px;width:100%;max-width:420px;max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 12px 36px rgba(0,0,0,.28);}
.popHd{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#fce7f3;color:#9d174d;font-weight:800;font-size:16px;position:sticky;top:0;}
.popHd .x{margin-left:auto;border:0;background:none;color:#9d174d;font-size:20px;cursor:pointer;}
.popHd .hl{font-size:12px;color:#dc2626;}
.list{padding:12px;display:flex;flex-direction:column;gap:8px;}
.item{display:flex;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px;}
.item .bar{width:4px;border-radius:2px;background:#cbd5e1;flex:none;}
.item.chief{background:#fdf2f8;} .item.chief .bar{background:#ec4899;}
.item.office{background:#fefce8;} .item.office .bar{background:#eab308;}
.item.etc .bar{background:#d1d5db;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .item.chief,:root:not([data-theme="light"]) .item.office{color:#111;} }
.item b{display:block;font-size:15px;}
.item .s{font-size:12.5px;color:var(--muted);margin-top:2px;}
.item .m{font-size:13px;margin-top:4px;white-space:pre-wrap;word-break:break-all;}
.empty{font-size:13px;color:var(--muted);padding:6px 2px;}
@media (max-width:700px){
  header h1{font-size:17px;} header h1 .appLogo{width:34px;height:24px;} header .sub{display:none;}
  main{padding:10px 8px calc(16px + env(safe-area-inset-bottom,0px));}
  .ym{font-size:17px;min-width:100px;} .legend{width:100%;margin:2px 0 0;justify-content:flex-end;font-size:11px;}
  .cell{min-height:max(64px, calc((100dvh - 250px) / var(--rows,5)));padding:3px 2px 4px;}
  .row{flex-direction:column;gap:0;} .num{font-size:12.5px;} .hol{font-size:9px;text-align:center;}
  .ev{font-size:10px;padding:0 2px;text-overflow:clip;}
  .more{font-size:9.5px;}
  .toSum{font-size:11.5px;padding:5px 8px;}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));} .card .v{font-size:19px;} .card.wide{grid-column:1 / -1;}
  .shTop .fy{font-size:16px;min-width:0;flex:1;} .shTop .sp{display:none;}
  table.tt{font-size:12.5px;} .tt th,.tt td{padding:6px 6px;} .tt th.s,.tt td.s{display:none;}
  .tt td.nt .sx{display:block;color:#0369a1;font-weight:700;} .toBtn{height:34px;font-size:12px;padding:0 10px;}
}
</style>
</head>
<body>
<header><h1><svg class="appLogo" viewBox="10 13 66 46" aria-hidden="true"><g fill="none" stroke="#e00000" stroke-width="2.6" stroke-linecap="square"><line x1="13.96" y1="40.48" x2="50.04" y2="17.52"/><line x1="35.96" y1="17.52" x2="72.04" y2="40.48"/><line x1="72.04" y1="31.52" x2="35.96" y2="54.48"/><line x1="50.04" y1="54.48" x2="13.96" y2="31.52"/><path d="M33 42 L37.3 31 L40.6 39.5"/><circle cx="47.6" cy="36.6" r="4.9"/></g></svg>Oh Won-il</h1><span class="sub">SNCT 노동조합</span><span class="live" id="live"><i></i><span>연결 중…</span></span></header>
<main>
  <div id="err"></div>
  <div class="tabs" id="tabs" hidden><button type="button" data-v="cal">📅 캘린더</button><button type="button" data-v="sheet">⏱ TIME OFF 시트</button></div>
  <div id="sheetView" hidden></div>

    <div class="nav"><button type="button" id="prev" aria-label="이전 달">‹</button><span class="ym" id="ym"></span><button type="button" id="next" aria-label="다음 달">›</button></div>
    <button type="button" class="today" id="today">오늘</button>
    <button type="button" class="toBtn" id="toBtn">⏱ TIME OFF</button><span class="toSum" id="toSum" hidden></span>
    <div class="legend"><span><i style="background:#e0f2fe"></i>TIME OFF</span><span><i style="background:#fbcfe8"></i>위원장</span><span><i style="background:#fef08a"></i>사무국</span><span><i style="background:#fff;border:1px solid #d1d5db"></i>기타</span></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note">SNCT 노동조합(UNION) 캘린더와 자동으로 연동돼요. 날짜를 누르면 그날 일정이 보여요. TIME OFF(하늘색)는 UNION 로그인 때만 보여요.</p>
  </div>
  <input type="file" id="toFile" accept=".xlsm,.xlsx,.xls" hidden>
</main>
<div id="pop"></div>
<script type="module">
// ===== Oh Won-il: SNCT 노동조합 사이트 캘린더(meta/cal_YYYY-MM)를 그대로 보여 줌(보기 전용, 실시간 연동) =====
const SDK = 'https://www.gstatic.com/firebasejs/12.19.0/';
const CFG = {apiKey:"AIzaSyDKNB0xNs-1FEv_UrlSfX9-fgjJph3YG8A", authDomain:"snct-d40ed.firebaseapp.com", projectId:"snct-d40ed", storageBucket:"snct-d40ed.firebasestorage.app", messagingSenderId:"236880210998", appId:"1:236880210998:web:b0abb11eae94b3103a3c97"};
const $ = id=> document.getElementById(id);
const pad = n=> String(n).padStart(2,'0'), ds = (y,m,d)=> `${y}-${pad(m)}-${pad(d)}`;
const todayStr = ()=>{ const t = new Date(); return ds(t.getFullYear(), t.getMonth()+1, t.getDate()); };
const esc = s=> String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ym = (()=>{ try{ const o = JSON.parse(localStorage.getItem('ohwonil_ym') || 'null'); if(o && o.y > 2000 && o.m >= 1 && o.m <= 12) return {y:o.y, m:o.m}; }catch(e){} const t = new Date(); return {y:t.getFullYear(), m:t.getMonth()+1}; })();   // 보던 달을 기억
const keep = ()=>{ try{ localStorage.setItem('ohwonil_ym', JSON.stringify(ym)); }catch(e){} };
const go = dm=>{ ym = dm < 0 ? (ym.m===1 ? {y:ym.y-1, m:12} : {y:ym.y, m:ym.m-1}) : (ym.m===12 ? {y:ym.y+1, m:1} : {y:ym.y, m:ym.m+1}); keep(); render(); };
const data = {}, unsubs = {}; let holidays = {}, popDay = '', fs = null, F = null;
// ===== TIME OFF: 위원장 전용 일정(타임오프 시간·스케줄·비고) — 클라우드 unionPrivate/timeoff(UNION 로그인 때만). 개인 일정이라 이 파일에는 넣지 않음 =====
const UNION_EMAIL = 'union@snct-d40ed.firebaseapp.com';
let A = null, auth = null, isUnion = false, toRows = {}, toUnsub = null, toPop = false, toMsg = '', toOk = false;
let toLimits = {}, toEdit = null, toErr = '';
const DEF_LIMIT = 1391;   // 연간 TIME OFF 한도(04.01 ~ 다음 해 03.31)
let view = (()=>{ try{ return localStorage.getItem('ohwonil_view') === 'sheet' ? 'sheet' : 'cal'; }catch(e){ return 'cal'; } })();
const fyOf = d=>{ const y = +d.slice(0,4), m = +d.slice(5,7); return m >= 4 ? y : y - 1; };
let fy = fyOf(todayStr());
const fyRange = y=> [`${y}-04-01`, `${y+1}-03-31`];
const limitOf = y=>{ const v = Number(toLimits[y]); return Number.isFinite(v) && v > 0 ? v : DEF_LIMIT; };
async function toSave(){
  const rows = Object.values(toRows).filter(r=> r && r.d && (r.h || r.s || r.n)).sort((a,b)=> a.d < b.d ? -1 : 1);
  await F.setDoc(F.doc(fs, 'unionPrivate', 'timeoff'), {json: JSON.stringify({rows, limits: toLimits, at: Date.now()}), at: Date.now()});
}
const toTitle = r=> [r.s, r.n].filter(Boolean).join(' · ');
const hstr = h=> (Math.round(h*10)/10).toString();
function toWatch(){
  if(toUnsub){ toUnsub(); toUnsub = null; }
  toRows = {};
  if(!isUnion || !F) { render(); return; }
  toUnsub = F.onSnapshot(F.doc(fs, 'unionPrivate', 'timeoff'), snap=>{ let v = null; try{ v = snap.exists() ? JSON.parse((snap.data()||{}).json || 'null') : null; }catch(e){} const m = {}; ((v && v.rows) || []).forEach(r=>{ if(r && r.d) m[r.d] = r; }); toRows = m; toLimits = (v && v.limits) || {}; render(); }, ()=>{ toRows = {}; render(); });
}
async function toImport(file){
  toMsg = '엑셀을 읽는 중…'; toOk = true; renderToPop();
  try{
    if(!window.XLSX) await new Promise((ok, no)=>{ const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const ws = wb.Sheets['일정']; if(!ws) throw new Error("'일정' 시트가 없어요");
    const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
    const toD = v=>{ if(typeof v==='number' && v > 30000 && v < 80000){ const t = new Date(Math.round((v - 25569) * 86400000)); return ds(t.getUTCFullYear(), t.getUTCMonth()+1, t.getUTCDate()); } return ''; };
    const txt = v=> v==null ? '' : String(v).trim();
    const rows = [];
    for(let i = 3; i < aoa.length; i++){
      const r = aoa[i] || [], d = toD(r[1]) || toD(r[0]); if(!d) continue;
      const h = Number(r[3]) || 0, s = txt(r[5]), n = txt(r[7]);
      if(h || s || n) rows.push({d, h, s, n});
    }
    if(!rows.length) throw new Error('가져올 일정이 없어요');
    await F.setDoc(F.doc(fs, 'unionPrivate', 'timeoff'), {json: JSON.stringify({rows, limits: toLimits, at: Date.now()}), at: Date.now()});
    toMsg = `${rows.length}개 날짜를 가져왔어요. (${rows[0].d} ~ ${rows[rows.length-1].d})`; toOk = true;
  }catch(e){ toMsg = '가져오지 못했어요: ' + ((e && (e.code || e.message)) || '오류'); toOk = false; }
  renderToPop();
}
function renderSheet(){
  const el = $('sheetView');
  if(document.activeElement && document.activeElement.id==='limIn') return;   // 한도 입력 중엔 다시 그리지 않음
  const [a, b] = fyRange(fy), today = todayStr(), L = limitOf(fy);
  const rows = Object.values(toRows).filter(r=> r.d >= a && r.d <= b).sort((x,y)=> x.d < y.d ? -1 : 1);
  const T = rows.reduce((s,r)=> s + (r.h||0), 0), U = rows.filter(r=> r.d <= today).reduce((s,r)=> s + (r.h||0), 0);
  const remT = L - T, remU = L - U, pct = Math.min(T / L * 100, 100);
  const card = (k, v, c='')=> `<div class="card ${c}"><div class="k">${k}</div><div class="v">${v}<small>시간</small></div></div>`;
  let body = '', curM = '', mSum = 0;
  const flush = ()=>{ if(curM) body += `<tr class="mo"><td>${+curM.slice(5)}월 소계</td><td class="h">${hstr(mSum)}</td><td class="s"></td><td></td></tr>`; };
  rows.forEach(r=>{
    const mm = r.d.slice(0,7); if(mm !== curM){ flush(); curM = mm; mSum = 0; }
    mSum += r.h||0;
    const [yy,m2,dd] = r.d.split('-').map(Number), w = new Date(yy,m2-1,dd).getDay();
    body += `<tr class="r${r.d > today ? ' future' : ''}" data-ed="${r.d}"><td class="d">${m2}/${dd}<span class="w${w===0?' su':w===6?' sa':''}">${'일월화수목금토'[w]}</span></td><td class="h">${r.h ? hstr(r.h) : ''}</td><td class="s">${esc(r.s)}</td><td class="nt">${r.s ? `<span class="sx" style="display:none">${esc(r.s)}</span>` : ''}${esc(r.n)}</td></tr>`;
  });
  flush();
  el.innerHTML = `<div class="sh">
    <div class="shTop"><button type="button" class="shBtn" id="fyPrev" aria-label="이전 연도">‹</button>
      <div class="fy">${fy}년도 TIME OFF<small>${fy}.04.01 ~ ${fy+1}.03.31</small></div>
      <button type="button" class="shBtn" id="fyNext" aria-label="다음 연도">›</button><span class="sp"></span>
      <button type="button" class="shBtn pri" id="toAdd">＋ 추가</button><button type="button" class="shBtn" id="toXl">📂 엑셀</button></div>
    <div class="cards">
      <div class="card lim"><div class="k">연간 한도</div><input type="number" id="limIn" min="0" step="1" value="${L}" inputmode="numeric"></div>
      ${card('사용 합계 (계획 포함)', hstr(T))}
      ${card('오늘까지 사용', hstr(U))}
      ${card('남은 시간 (연말 기준)', hstr(remT), remT < 0 ? 'neg' : 'pos')}
      ${card('남은 시간 (오늘 기준)', hstr(remU), remU < 0 ? 'neg' : 'pos')}
    </div>
    <div class="bar2${T > L ? ' over' : ''}" title="한도 대비 ${Math.round(T/L*100)}%"><i style="width:${pct}%"></i></div>
    <p class="shNote">한도 ${hstr(L)}시간 중 ${hstr(T)}시간(${Math.round(T/L*100)}%)${remT < 0 ? ` — <b style="color:#dc2626">${hstr(-remT)}시간 초과</b>` : ''}. 오늘 뒤 날짜(흐린 글씨)는 계획이에요. 줄을 누르면 고칠 수 있어요.</p>
    ${toErr ? `<div class="err">${esc(toErr)}</div>` : ''}
    <div class="tblWrap"><table class="tt"><thead><tr><th>날짜</th><th class="h">시간</th><th class="s">스케줄</th><th>비고</th></tr></thead>
      <tbody>${body || '<tr><td colspan="4" class="nt" style="color:var(--muted)">이 연도에는 TIME OFF가 없어요. ＋ 추가 또는 📂 엑셀로 넣어 주세요.</td></tr>'}</tbody>
      <tfoot><tr><td>합계</td><td class="h">${hstr(T)}</td><td class="s"></td><td>남은 ${hstr(remT)}시간</td></tr></tfoot></table></div>
  </div>`;
  if(window.matchMedia('(max-width:700px)').matches) el.querySelectorAll('.sx').forEach(x=> x.style.display = 'block');   // 휴대폰: 스케줄을 비고 칸 위에
  $('fyPrev').onclick = ()=>{ fy--; render(); };
  $('fyNext').onclick = ()=>{ fy++; render(); };
  $('toAdd').onclick = ()=>{ toEdit = {d: todayStr() >= a && todayStr() <= b ? todayStr() : a, h: 8, s: '', n: '', isNew: true}; renderEdit(); };
  $('toXl').onclick = ()=>{ toPop = true; toMsg = ''; renderToPop(); };
  el.querySelectorAll('[data-ed]').forEach(tr=> tr.onclick = ()=>{ const r = toRows[tr.dataset.ed]; toEdit = Object.assign({}, r, {orig: r.d}); renderEdit(); });
  const li = $('limIn');
  li.onchange = async ()=>{ const v = Number(li.value); if(!(v > 0)) { li.value = L; return; } toLimits = Object.assign({}, toLimits, {[fy]: v}); li.blur(); try{ toErr = ''; await toSave(); }catch(e){ toErr = '저장하지 못했어요: ' + ((e && e.code) || '오류'); } render(); };
  li.onkeydown = e=>{ if(e.key==='Enter') li.blur(); };
  li.onblur = ()=>{ if(Number(li.value) !== L) li.onchange(); else render(); };
}
function renderEdit(){
  let box = $('toEd');
  if(!toEdit){ if(box) box.remove(); return; }
  if(!box){ box = document.createElement('div'); box.id = 'toEd'; document.body.appendChild(box); }
  const e = toEdit;
  box.innerHTML = `<div class="scrim" id="edScrim"><div class="pop" role="dialog" aria-label="TIME OFF ${e.isNew ? '추가' : '수정'}"><div class="popHd">⏱ TIME OFF ${e.isNew ? '추가' : '수정'}<button type="button" class="x" id="edX" aria-label="닫기">✕</button></div>
    <div class="toForm">
      <label>날짜<input type="date" id="edD" value="${esc(e.d)}"></label>
      <label>타임오프 시간<input type="number" id="edH" min="0" step="0.5" inputmode="decimal" value="${e.h || ''}"></label>
      <label>스케줄<input type="text" id="edS" maxlength="60" value="${esc(e.s||'')}" placeholder="예: 노조업무"></label>
      <label>비고<input type="text" id="edN" maxlength="200" value="${esc(e.n||'')}" placeholder="예: 1차교섭(48), 휴가"></label>
      <div class="msg" id="edMsg"></div>
      <div class="btns">${e.isNew ? '' : '<button type="button" class="del" id="edDel">🗑 삭제</button>'}<button type="button" id="edCancel">취소</button><button type="button" class="pri" id="edSave">💾 저장</button></div>
    </div></div></div>`;
  const close = ()=>{ toEdit = null; renderEdit(); };
  $('edX').onclick = close; $('edCancel').onclick = close; $('edScrim').onclick = ev=>{ if(ev.target.id==='edScrim') close(); };
  const msg = t=> $('edMsg').textContent = t;
  $('edSave').onclick = async ()=>{
    const d = $('edD').value, h = Number($('edH').value) || 0, s2 = $('edS').value.trim(), n = $('edN').value.trim();
    if(!d) return msg('날짜를 고르세요.');
    if(!h && !s2 && !n) return msg('시간·스케줄·비고 중 하나는 넣어 주세요.');
    const backup = Object.assign({}, toRows);
    if(e.orig && e.orig !== d) delete toRows[e.orig];
    toRows[d] = {d, h, s: s2, n};
    msg('저장 중…');
    try{ await toSave(); fy = fyOf(d); close(); render(); }catch(err){ toRows = backup; msg('저장하지 못했어요: ' + ((err && err.code) || '오류')); }
  };
  if($('edDel')) $('edDel').onclick = async ()=>{
    const backup = Object.assign({}, toRows); delete toRows[e.orig]; msg('삭제 중…');
    try{ await toSave(); close(); render(); }catch(err){ toRows = backup; msg('삭제하지 못했어요: ' + ((err && err.code) || '오류')); }
  };
}
function renderToPop(){
  const el = $('toPop'); if(!toPop){ if(el) el.remove(); return; }
  const body = isUnion
    ? `<div class="hint">위원장 스케줄 엑셀(.xlsm)의 '일정' 시트(날짜·타임오프·스케줄·비고)를 가져와요. 다시 가져오면 새 엑셀 내용으로 바뀌어요.</div>
       <div class="btns"><button type="button" class="pri" id="toPick">📂 엑셀 가져오기</button><button type="button" id="toOut">로그아웃</button></div>`
    : `<div class="hint">TIME OFF는 UNION만 볼 수 있어요. UNION 비밀번호를 넣어 주세요.</div>
       <input type="password" id="toPw" autocomplete="current-password" placeholder="UNION 비밀번호">
       <div class="btns"><button type="button" class="pri" id="toLogin">로그인</button></div>`;
  const html = `<div class="scrim" id="toScrim"><div class="pop" role="dialog" aria-label="TIME OFF"><div class="popHd">⏱ TIME OFF<button type="button" class="x" id="toX" aria-label="닫기">✕</button></div>
    <div class="toForm">${body}<div class="msg${toOk ? ' ok' : ''}">${esc(toMsg)}</div></div></div></div>`;
  let box = el; if(!box){ box = document.createElement('div'); box.id = 'toPop'; document.body.appendChild(box); }
  box.innerHTML = html;
  const close = ()=>{ toPop = false; toMsg = ''; renderToPop(); };
  $('toX').onclick = close; $('toScrim').onclick = e=>{ if(e.target.id==='toScrim') close(); };
  if(isUnion){
    $('toPick').onclick = ()=> $('toFile').click();
    $('toOut').onclick = async ()=>{ try{ await A.signOut(auth); }catch(e){} close(); };
  } else {
    const go = async ()=>{ const pw = $('toPw').value; if(!pw) return; toMsg = '로그인 중…'; toOk = true; renderToPop();
      try{ await A.signInWithEmailAndPassword(auth, UNION_EMAIL, pw); toMsg = '로그인했어요.'; toOk = true; }catch(e){ toMsg = '비밀번호가 맞지 않아요.'; toOk = false; } renderToPop(); };
    $('toLogin').onclick = go; $('toPw').onkeydown = e=>{ if(e.key==='Enter') go(); };
    setTimeout(()=>{ const p = $('toPw'); if(p) p.focus(); }, 30);
  }
}
const key = (y,m)=> `${y}-${pad(m)}`, prevKey = (y,m)=> m===1 ? key(y-1,12) : key(y,m-1);
const end = e=> e.e && e.e > e.d ? e.e : e.d, on = (e,d)=> e.d <= d && d <= end(e);
const cls = e=> e.who==='위원장' ? 'chief' : e.who==='사무국' ? 'office' : e.who==='기타' ? 'etc' : '';
const parse = snap=>{ try{ const v = snap.exists() ? JSON.parse((snap.data()||{}).json || '[]') : []; return Array.isArray(v) ? v : []; }catch(e){ return []; } };
function watch(k){
  if(!F || unsubs[k]) return;
  unsubs[k] = F.onSnapshot(F.doc(fs, 'meta', 'cal_' + k), snap=>{ data[k] = parse(snap); live(true); render(); }, err=>{ live(false); $('err').innerHTML = '<div class="err">일정을 불러오지 못했어요. 잠시 뒤 새로고침 해 주세요.</div>'; });
}
function live(ok){ $('live').className = 'live' + (ok ? ' on' : ''); $('live').lastElementChild.textContent = ok ? '실시간 연동' : '연결 중…'; }
function monthEvents(y, m){ const first = ds(y,m,1); return (data[key(y,m)]||[]).concat((data[prevKey(y,m)]||[]).filter(e=> end(e) >= first)); }
function label(d){ const [y,m,dd] = d.split('-').map(Number); return `${m}월 ${dd}일 (${'일월화수목금토'[new Date(y,m-1,dd).getDay()]})`; }
function range(e){ if(end(e)===e.d) return ''; const f = x=>{ const [,mm,dd] = x.split('-').map(Number); return `${mm}/${dd}`; }; return `${f(e.d)} ~ ${f(end(e))}`; }
function render(){
  $('tabs').hidden = !isUnion; if(!isUnion) view = 'cal';
  $('tabs').querySelectorAll('button').forEach(b=> b.classList.toggle('on', b.dataset.v===view));
  $('calView').hidden = view !== 'cal'; $('sheetView').hidden = view !== 'sheet';
  if(view==='sheet') renderSheet();
  const {y, m} = ym; watch(key(y,m)); watch(prevKey(y,m));
  $('ym').textContent = `${y}년 ${m}월`;
  { const k = key(y,m), sum = Object.values(toRows).filter(r=> r.d.slice(0,7)===k).reduce((a,r)=> a + (r.h||0), 0), el = $('toSum');
    el.hidden = !isUnion; el.textContent = `이번 달 TIME OFF ${hstr(sum)}시간`; $('toBtn').textContent = isUnion ? '⏱ TIME OFF' : '🔒 TIME OFF'; }
  const first = new Date(y, m-1, 1).getDay(), days = new Date(y, m, 0).getDate(), today = todayStr(), list = monthEvents(y, m);
  const cells = []; for(let i = 0; i < first; i++) cells.push('<div class="cell out"></div>');
  for(let d = 1; d <= days; d++){
    const D = ds(y,m,d), w = (first + d - 1) % 7, hol = holidays[D];
    const ev = list.filter(e=> on(e, D)).sort((a,b)=> (a.d < b.d ? -1 : a.d > b.d ? 1 : 0) || String(a.t||'').localeCompare(String(b.t||'')));
    cells.push(`<button type="button" class="cell${w===0?' sun':w===6?' sat':''}${hol?' hl':''}${D===today?' today':''}" data-day="${D}"><span class="row"><span class="num">${d}</span>${hol ? `<span class="hol">${esc(hol)}</span>` : ''}</span>
      ${toRows[D] ? `<span class="ev to">${toRows[D].h ? `<b>${hstr(toRows[D].h)}h</b>` : ''}${esc(toTitle(toRows[D]) || (toRows[D].h ? '' : 'TIME OFF'))}</span>` : ''}
      ${ev.slice(0,3).map(e=> `<span class="ev ${cls(e)}">* ${esc(e.title||'')}${e.t && e.d===D ? ` <b>${esc(e.t)}</b>` : ''}</span>`).join('')}${ev.length > 3 ? `<span class="more">+${ev.length-3}개 더</span>` : ''}</button>`);
  }
  while(cells.length % 7) cells.push('<div class="cell out"></div>');
  $('grid').style.setProperty('--rows', cells.length/7);
  $('grid').innerHTML = '일월화수목금토'.split('').map((t,i)=> `<div class="dow${i===0?' sun':i===6?' sat':''}">${t}</div>`).join('') + cells.join('');
  $('grid').querySelectorAll('[data-day]').forEach(b=> b.onclick = ()=>{ popDay = b.dataset.day; renderPop(); });
  renderPop();
}
function renderPop(){
  if(!popDay){ $('pop').innerHTML = ''; return; }
  const [y,m] = popDay.split('-').map(Number), ev = monthEvents(y, m).filter(e=> on(e, popDay));
  $('pop').innerHTML = `<div class="scrim" id="scrim"><div class="pop" role="dialog" aria-label="${esc(label(popDay))} 일정"><div class="popHd">${esc(label(popDay))}${holidays[popDay] ? `<span class="hl">${esc(holidays[popDay])}</span>` : ''}<button type="button" class="x" id="x" aria-label="닫기">✕</button></div>
    <div class="list">${toRows[popDay] ? `<div class="item to"><span class="bar"></span><div><b>⏱ TIME OFF${toRows[popDay].h ? ' ' + esc(hstr(toRows[popDay].h)) + '시간' : ''}</b>${toRows[popDay].s ? `<div class="s">스케줄: ${esc(toRows[popDay].s)}</div>` : ''}${toRows[popDay].n ? `<div class="m">${esc(toRows[popDay].n)}</div>` : ''}</div></div>` : ''}${ev.length ? ev.map(e=> `<div class="item ${cls(e)}"><span class="bar"></span><div><b>${esc(e.title||'(제목 없음)')}</b>${range(e) || e.t ? `<div class="s">${range(e) ? '📅 ' + esc(range(e)) : ''}${range(e) && e.t ? ' · ' : ''}${e.t ? '🕘 ' + esc(e.t) : ''}${e.who ? ' · ' + esc(e.who) : ''}</div>` : (e.who ? `<div class="s">${esc(e.who)}</div>` : '')}${e.memo ? `<div class="m">${esc(e.memo)}</div>` : ''}</div></div>`).join('') : (toRows[popDay] ? '' : '<div class="empty">이 날은 일정이 없어요.</div>')}</div></div></div>`;
  $('x').onclick = ()=>{ popDay = ''; renderPop(); };
  $('scrim').onclick = e=>{ if(e.target.id==='scrim'){ popDay = ''; renderPop(); } };
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && toEdit){ toEdit = null; renderEdit(); return; } if(e.key==='Escape' && popDay){ popDay = ''; renderPop(); } });
$('prev').onclick = ()=> go(-1);
$('tabs').querySelectorAll('button').forEach(b=> b.onclick = ()=>{ view = b.dataset.v; try{ localStorage.setItem('ohwonil_view', view); }catch(e){} render(); });
$('toBtn').onclick = ()=>{ if(!auth){ $('err').innerHTML = '<div class="err">아직 연결 중이에요. 잠시 뒤 다시 눌러 주세요.</div>'; return; } toPop = true; toMsg = ''; renderToPop(); };
$('toFile').onchange = e=>{ const f = e.target.files && e.target.files[0]; e.target.value = ''; if(f) toImport(f); };
$('next').onclick = ()=> go(1);
$('today').onclick = ()=>{ const t = new Date(); ym = {y:t.getFullYear(), m:t.getMonth()+1}; keep(); render(); };
{ let sx = 0, sy = 0, st = 0; const g = $('grid');   // 휴대폰: 달력을 옆으로 밀면 다음/이전 달
  g.addEventListener('touchstart', e=>{ const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); }, {passive:true});
  g.addEventListener('touchend', e=>{ const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - st < 800){ e.preventDefault(); go(dx < 0 ? 1 : -1); } }); }
render();
try{
  const [Ap, Fm, Au] = await Promise.all([import(SDK + 'firebase-app.js'), import(SDK + 'firebase-firestore.js'), import(SDK + 'firebase-auth.js')]);
  const app = Ap.initializeApp(CFG); F = Fm; fs = Fm.getFirestore(app); A = Au; auth = Au.getAuth(app);
  Au.onAuthStateChanged(auth, u=>{ isUnion = !!(u && String(u.email||'').toLowerCase()===UNION_EMAIL); toWatch(); if(toPop) renderToPop(); });   // UNION 사이트에서 로그인해 두었으면(같은 주소) 그대로 로그인 상태
  Fm.onSnapshot(Fm.collection(fs, 'holidays'), snap=>{ const h = {}; snap.forEach(d=>{ const v = d.data(); if(v && v.date) h[v.date] = v.name; }); holidays = h; render(); }, ()=>{});
  render();
}catch(e){ live(false); $('err').innerHTML = '<div class="err">인터넷 연결을 확인해 주세요.</div>'; }
